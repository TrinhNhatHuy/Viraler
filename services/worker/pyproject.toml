[project]
name = "viraler-worker"
version = "0.0.0"
description = "Viraler AI worker: claims jobs from Postgres and runs TTS, transcription, etc."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "psycopg[binary]==3.3.6",
    "httpx==0.28.1",
    "kokoro-onnx==0.6.1",
    "numpy==2.4.6",
    # 3.4.1 was published 2026-11-02; hold until it has aged a few days.
    "phonemizer==3.4.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: real model inference (run with -m slow)"]
addopts = "-m 'not slow'"
